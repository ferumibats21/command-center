name: Update prices
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
jobs:
  prices:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harga hari ini
        run: node scripts/update_prices.mjs
      - name: Riwayat dan nilai harian
        if: always()
        run: node scripts/history.mjs daily
